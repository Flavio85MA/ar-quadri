<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quadri in AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Seleziona il quadro e aprilo in AR</h1>
    <p>Tocca un titolo per caricare l’anteprima, poi premi “Vedi in AR”.</p>
  </header>

  <!-- ELENCO TITOLI -->
  <section class="list">
    <ul id="names">
      <li><button data-key="veglia">Veglia sul mare</button></li>
      <li><button data-key="borgo">Il borgo che guarda il mare</button></li>
      <li><button data-key="castello">Il castello e il mare</button></li>
      <li><button data-key="liberta">Libertà al tramonto</button></li>
      <li><button data-key="maremma">Maremma</button></li>
      <li><button data-key="tramonto_doro">Tramonto d’oro</button></li>
    </ul>
  </section>

  <!-- ANTEPRIMA + CTA -->
  <section class="panel">
    <div class="meta">
      <div class="row">
        <span>Selezionato:</span>
        <strong id="selName">—</strong>
      </div>

      <div class="cta">
        <!-- unico pulsante -->
        <button id="openAR" class="btn primary">Vedi in AR</button>
      </div>
    </div>

    <model-viewer id="viewer"
      src=""
      ios-src=""
      alt="Anteprima quadro"
      ar ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      camera-controls
      environment-image="neutral"
      exposure="1.1"
      shadow-intensity="0.2"
      style="width:100%;height:62vh;background:#fff;border:1px solid #eee;border-radius:12px;">
      <div slot="poster" class="poster">Caricamento…</div>
    </model-viewer>

    <!-- anchor nascosta solo per iOS Quick Look -->
    <a id="iosArHidden" rel="ar" href="#" style="display:none"></a>
  </section>

  <footer class="foot">
    <small>Apri questa pagina direttamente in Safari/Chrome sul telefono (non dentro app social) per la migliore esperienza AR.</small>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
