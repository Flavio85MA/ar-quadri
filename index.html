<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quadri in AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Scegli la tela e aprila in AR</h1>
    <p>Tocca un titolo per caricare il modello, poi premi “Apri in AR”.</p>
  </header>

  <section class="controls">
    <div class="buttons">
      <button onclick="cambiaTela('veglia_sul_mare')">Veglia sul mare</button>
      <button onclick="cambiaTela('il_borgo_che_guarda_il_mare')">Il borgo che guarda il mare</button>
      <button onclick="cambiaTela('il_castello_e_il_mare')">Il castello e il mare</button>
      <button onclick="cambiaTela('libertà_al_tramonto')">Libertà al tramonto</button>
      <button onclick="cambiaTela('maremma')">Maremma</button>
      <!-- attenzione all'apostrofo: usiamo l'entità HTML -->
      <button onclick="cambiaTela('tramonto_d&#39;oro')">Tramonto d’oro</button>
    </div>
    <div class="now">
      <span>Selezionato:</span> <strong id="selName">—</strong>
      <button class="primary" id="openAR">Apri in AR</button>
    </div>
  </section>

  <section class="viewer">
    <model-viewer id="viewer"
      src=""
      ios-src=""
      alt="Visualizzatore 3D"
      ar ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      camera-controls
      environment-image="neutral"
      exposure="1.0"
      shadow-intensity="0.15"
      style="width:100%;height:70vh;background:#fff;border:1px solid #eee;border-radius:12px;">
      <div slot="poster" class="poster">Caricamento…</div>
    </model-viewer>
  </section>

  <footer class="foot">
    <small>Consiglio: prova da iPhone o Android per aprire in AR.</small>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
