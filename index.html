<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quadri in AR</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Shim model-viewer (serve anche per iOS Quick Look) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Quadri in AR</h1>
    <p class="lead">Seleziona un quadro e tocca <strong>Vedi in AR</strong>.</p>

    <div id="list" class="list-grid" aria-live="polite"></div>

    <div class="actions">
      <button id="btnAR" class="btn" type="button" disabled>Vedi in AR</button>
    </div>
  </div>

  <!-- model-viewer “carrier” invisibile per attivare AR -->
  <model-viewer id="mv" class="hidden-ar"
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="wall"
    ar-scale="fixed">
  </model-viewer>

  <script defer src="script.js"></script>
</body>
</html>
