<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quadri in AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Visualizza le tele in AR</h1>
    <p>Scegli la tela e premi “Apri in AR”.</p>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Seleziona una tela</h2>
      <div id="list" class="list"></div>
    </aside>

    <section class="stage">
      <div class="viewer-wrap">
        <model-viewer id="viewer"
          src="./veglia_sul_mare.glb"
          ios-src="./veglia_sul_mare.usdz"
          alt="Anteprima tela"
          ar ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          camera-controls
          environment-image="neutral"
          exposure="1.0"
          shadow-intensity="0.15"
          style="width:100%;height:70vh;border-radius:12px;background:#f7f7f7;">
          <div slot="poster" class="poster">Caricamento…</div>
        </model-viewer>

        <div class="cta">
          <button id="openAR" class="primary">Apri in AR</button>
          <div id="meta" class="meta">—</div>
        </div>

        <p class="note">
          Suggerimento iPhone: se il file <code>.usdz</code> si scarica invece di aprirsi in AR,
          sposteremo i file USDZ su un hosting che imposta il MIME <code>model/vnd.usdz+zip</code>.
        </p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <small>© La tua galleria – AR demo</small>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
